name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-checks:
    name: Documentation & Schema Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Tools Dependencies
        working-directory: tools
        run: npm ci
      - name: Run Documentation Audit
        run: node tools/check_docs.js
      - name: Validate OpenAPI Schema
        run: node tools/check-openapi.mjs
      - name: Validate PostgreSQL DDL
        run: node tools/check-sql.mjs

  backend:
    name: Backend Tests (Java 21, Postgres 16, Testcontainers)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: aegis
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3
      - name: Run Backend Tests
        env:
          AEGIS_PG_URL: jdbc:postgresql://localhost:5432/aegis
          AEGIS_PG_USER: aegis
          AEGIS_PG_PASSWORD: aegis
        run: |
          ./backend/gradlew -p backend test --no-daemon
      - name: Verify zero skipped Docker tests
        run: |
          if grep -r "SKIPPED" backend/*/build/test-results/test/*.xml | grep -i "docker"; then
            echo "Error: Docker-dependent tests were skipped in CI!"
            exit 1
          fi

  frontend:
    name: Frontend Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Unit Tests (Vitest)
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        run: npm run build

  website:
    name: Website Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Website Dependencies
        working-directory: website
        run: npm ci
      - name: Build Website
        working-directory: website
        run: npm run build

  e2e:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright Browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run E2E Tests
        working-directory: frontend
        run: npm run e2e

