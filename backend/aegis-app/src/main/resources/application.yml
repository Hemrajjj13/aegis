spring:
  application:
    name: aegis-decision-engine
  profiles:
    active: tier0
  datasource:
    url: jdbc:postgresql://localhost:5432/aegis
    username: aegis
    password: aegis
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
