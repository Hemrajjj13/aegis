# Project Aegis - Production Deployment Profile (prod)
spring:
  config:
    activate:
      on-profile: prod
    import:
      - "optional:file:.env[.properties]"
      - "optional:file:../.env[.properties]"
      - "optional:file:backend/.env[.properties]"

  datasource:
    url: ${AEGIS_PG_URL}
    username: ${AEGIS_PG_USER}
    password: ${AEGIS_PG_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: AegisProdHikariPool
      maximum-pool-size: ${AEGIS_DB_MAX_POOL_SIZE:10}
      minimum-idle: ${AEGIS_DB_MIN_IDLE:2}
      idle-timeout: 300000
      max-lifetime: 600000
      connection-timeout: 20000

  flyway:
    enabled: true
    out-of-order: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: native
  tomcat:
    remoteip:
      remote-ip-header: X-Forwarded-For
      protocol-header: X-Forwarded-Proto

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    root: INFO
    com.aegis: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN
