spring:
  application:
    name: aegis-identity-test
  profiles:
    active: tier0
  datasource:
    url: ${AEGIS_PG_URL:jdbc:postgresql://127.0.0.1:5432/aegis}
    username: ${AEGIS_PG_USER:aegis}
    password: ${AEGIS_PG_PASSWORD:aegis}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    out-of-order: true
    locations: classpath:db/migration

aegis:
  auth:
    mode: jwt

